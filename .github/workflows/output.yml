name: Generate RS Ratings

on:
  schedule:
    # Runs Tuesday through Saturday at 02:17 UTC
    # (Monday through Friday at 9:17 PM EST)
    - cron: '17 2 * * 2-6'
  workflow_dispatch: # Allows manual runs from the Actions tab

jobs:
  generate-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # Required for GITHUB_TOKEN to push CSVs back to your repo

    steps:
      # ── 1. Checkout your fork ──────────────────────────────────────────────
      - name: Checkout relative-strength repo
        uses: actions/checkout@v4

      # ── 1.5. Download Fred's pre-built ticker_info.json cache ───────────────
      - name: Download Fred's pre-built ticker_info.json
        run: |
          mkdir -p data_persist
          curl -f -L -o data_persist/ticker_info.json "https://raw.githubusercontent.com/Fred6725/relative-strength/main/data_persist/ticker_info.json"

      # ── 2. Set up Python 3.11 ──────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. Install & verify dependencies ───────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify yfinance + curl_cffi
        run: |
          python -c "import yfinance; print('yfinance', yfinance.__version__)"
          python -c "import curl_cffi; print('curl_cffi OK')"

      # ── 4. Run RS calculation ──────────────────────────────────────────────
      - name: Run relative strength calculation
        run: python relative-strength.py true

      # ── 5. Force-commit cache & output CSVs back to your repo ──────────────
      - name: Commit and push results
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -f data_persist/ticker_info.json output/*.csv
          git diff --staged --quiet || git commit -m "RS Ratings & cache update $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
